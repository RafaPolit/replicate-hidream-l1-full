name: hidream-l1-full
description: HiDream model for generating text-to-image results
version: "1.0"

build:
  gpu: true
  python_version: "3.10"
  system_packages:
    - "libgl1-mesa-glx"
    - "ffmpeg"
  python_packages:
    - -r requirements.txt
  run:
    - pip install git+https://github.com/open-mmlab/mmengine.git
    - pip install git+https://github.com/open-mmlab/mmcv.git
    - pip install git+https://github.com/open-mmlab/mmagic.git

predict: "predict.py:Predictor"
